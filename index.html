<!doctype html>
<html lang="en">

    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #0b1118; color: #f5f7fa; }
      main { min-height: 100vh; max-width: 680px; margin: 0 auto; padding: 72px 24px; box-sizing: border-box; }
      h1 { margin: 0 0 12px; font-size: clamp(36px, 8vw, 58px); letter-spacing: -0.04em; }
      p { color: #b8c0cc; font-size: 18px; line-height: 1.6; }
      nav { display: grid; gap: 12px; margin-top: 36px; }
      a { display: block; padding: 16px 18px; border: 1px solid #344050; border-radius: 14px; color: #5de2af; font-weight: 700; text-decoration: none; }
      a:hover, a:focus-visible { border-color: #5de2af; outline: none; }
    </style>

    <main>
      <h1>SubKiller</h1>
